<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pesquise Pokémon e consulte seus tipos e atributos na Pokédex.">
  <title>Minha Pokédex</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Aluno(a): escreva seu nome aqui. -->
  <header>
    <h1>Minha Pokédex</h1>
    <p>Pesquise um Pokémon pelo nome ou número.</p>
  </header>

  <main>
    <form id="form-busca">
      <label for="nome-pokemon">Nome ou número do Pokémon</label>
      <div class="busca">
        <input
          id="nome-pokemon"
          name="pokemon"
          type="text"
          placeholder="Ex.: Pikachu ou 25"
          autocomplete="off"
        >
        <button type="submit">Buscar</button>
      </div>
    </form>

    <section id="resultado" aria-live="polite" aria-label="Resultado da busca"></section>
  </main>
</body>
</html>
